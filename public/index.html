<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自動部屋割り君 - 柏島ヴィレッジ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <h1>柏島ヴィレッジ　部屋割り管理</h1>
    <div class="topbar-hint">タイルをドラッグして入れ替え／タップして詳細編集</div>
  </div>
  <div class="toolbar">
    <label class="upload-btn">
      CSVアップロード
      <input type="file" id="csvFile" accept=".csv,.CSV" hidden>
    </label>
    <div class="date-nav">
      <button id="datePrevBtn" class="date-nav-btn" title="前日" type="button">＜</button>
      <input type="date" id="datePicker">
      <button id="dateNextBtn" class="date-nav-btn" title="翌日" type="button">＞</button>
    </div>
    <button id="genBtn" class="primary">生成/更新</button>
    <button id="forceGenBtn" class="danger" title="固定していないセルを全て再生成します">強制再生成</button>
    <button id="multiDayBtn">3日間ビュー</button>
    <button id="mealMultiDayBtn">3日間食事表</button>
    <span class="total-amount">決済合計 <strong id="totalAmount">¥0</strong></span>
    <span id="saveStatus" class="save-status"></span>
  </div>
</header>

<div id="issuesBox" class="issues-box" hidden>
  <h3>⚠ 要確認事項</h3>
  <ul id="issuesList"></ul>
</div>

<main id="app">
  <p class="hint">CSVをアップロードし、日付を選んでください。タイルをタップすると詳細を編集できます。</p>
</main>

<section id="mealSummary" class="meal-summary"></section>

<div id="multiDayView" class="multi-day-view" hidden>
  <div class="multi-day-toolbar no-print">
    <button id="backToEditBtn">← 編集画面に戻る</button>
    <button id="printBtn">印刷する</button>
  </div>
  <div id="multiDayPages"></div>
</div>

<div id="mealMultiDayView" class="multi-day-view" hidden>
  <div class="multi-day-toolbar no-print">
    <button id="mealBackToEditBtn">← 編集画面に戻る</button>
    <button id="mealPrintBtn">印刷する</button>
  </div>
  <div id="mealMultiDayPages"></div>
</div>

<!-- 部屋詳細モーダル -->
<div id="roomModal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalRoomTitle"></div>
        <div class="modal-sub" id="modalRoomSub"></div>
      </div>
      <button id="modalClose" class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <button id="modalCancelBtn" class="cancel-btn">⚠ キャンセル・空室化</button>
      <button id="modalLockBtn" class="lock-btn"></button>

      <div class="modal-row">
        <div class="modal-field">
          <label>チェックイン日（予約情報・変更不可）</label>
          <input id="modalCheckin" type="date" disabled>
        </div>
      </div>
      <div class="modal-row name-nights-row">
        <div class="modal-field name-field">
          <label>お名前</label>
          <input id="modalGuestName" placeholder="（空室）">
        </div>
        <div class="modal-field nights-field">
          <label>何泊</label>
          <select id="modalNights">
            <option value="1">1泊</option>
            <option value="2">2泊</option>
            <option value="3">3泊</option>
            <option value="4">4泊</option>
            <option value="5">5泊</option>
            <option value="6">6泊</option>
            <option value="7">7泊</option>
            <option value="8">8泊</option>
            <option value="9">9泊</option>
            <option value="10">10泊</option>
          </select>
        </div>
      </div>
      <div class="modal-row">
        <div class="modal-field">
          <label>サイト</label>
          <input id="modalSite" placeholder="サイト">
        </div>
        <div class="modal-field">
          <label>金額</label>
          <input id="modalAmount" type="number" placeholder="金額">
        </div>
      </div>
      <div class="modal-row pax-fields">
        <div class="modal-field"><label>大人</label><input id="modalAdults" type="number" min="0"></div>
        <div class="modal-field"><label>子供</label><input id="modalChildren" type="number" min="0"></div>
        <div class="modal-field"><label>幼児</label><input id="modalInfants" type="number" min="0"></div>
      </div>

      <div class="modal-field">
        <label>📝 メモ（現地追加オーダー等）</label>
        <textarea id="modalMemo" rows="3" placeholder="例）鰹タタキ×2追加　現金受取済"></textarea>
      </div>

      <div id="mealCategories"></div>
    </div>
  </div>
</div>

<template id="roomCellTemplate">
  <div class="room-cell">
    <span class="lock-icon" title="固定中"></span>
    <span class="review-badge" hidden>要確認</span>
    <div class="room-no"></div>
    <div class="guest-name"></div>
    <div class="site-tag"></div>
    <div class="cell-footer">
      <span class="pax-badge"></span>
      <span class="amount-badge"></span>
    </div>
  </div>
</template>

<template id="mealCategoryTemplate">
  <div class="meal-category">
    <div class="meal-category-title">
      <span class="mc-title"></span>
      <span class="mc-note"></span>
    </div>
    <div class="meal-items"></div>
  </div>
</template>

<template id="mealItemRowTemplate">
  <div class="meal-item-row">
    <span class="mi-label"></span>
    <div class="mi-stepper">
      <button class="mi-minus" type="button">−</button>
      <span class="mi-count">0</span>
      <button class="mi-plus" type="button">+</button>
    </div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
